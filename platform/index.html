<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>重劃地圖</title>
  <meta name="description" content="六都市地重劃範圍與負擔比率，整合國土測繪中心、地方政府與開放資料的公開圖資：地籍、都市計畫分區、災害潛勢、地形與市地重劃範圍。">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="vendor/leaflet.css">
  <link rel="stylesheet" href="vendor/maplibre-gl.css">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div id="app">
    <!-- 左側功能選單 -->
    <aside id="sidebar" class="sidebar">
      <div class="brand">
        <button class="brand-mark" id="brandMark" type="button" aria-label="展開或收合選單"></button>
        <div class="brand-text">
          <div class="brand-name" id="brandName"></div>
          <div class="brand-sub" id="brandSub"></div>
        </div>
        <button class="icon-btn collapse-btn" id="collapseBtn" type="button" title="收合選單"><i data-lucide="chevrons-left"></i></button>
      </div>
      <nav class="nav" id="nav"></nav>
      <div class="sidebar-foot">
        <span class="foot-text">資料來源皆為公開圖資</span>
      </div>
    </aside>

    <!-- 左側滑出面板 -->
    <section id="panel" class="panel" hidden>
      <header class="panel-head">
        <div class="panel-title"></div>
        <button class="icon-btn" id="panelClose" type="button" aria-label="關閉"><i data-lucide="x"></i></button>
      </header>
      <div class="panel-body" id="panelBody"></div>
    </section>

    <!-- 地圖 -->
    <main class="map-wrap">
      <div id="map"></div>

      <!-- 右上工具列 -->
      <div class="tool-dock" id="toolDock"></div>

      <!-- 右側圖層面板 -->
      <section id="layerPanel" class="layer-panel" hidden>
        <header class="panel-head">
          <div class="panel-title"><i data-lucide="layers"></i><span>圖層與底圖</span></div>
          <button class="icon-btn" id="layerClose" type="button" aria-label="關閉"><i data-lucide="x"></i></button>
        </header>
        <div class="panel-body" id="layerBody"></div>
      </section>

      <!-- 量測結果 -->
      <div class="measure-bar" id="measureBar" hidden></div>

      <!-- 座標列 -->
      <div class="coord-bar" id="coordBar"></div>

      <div class="toast" id="toast" role="status" aria-live="polite"></div>
    </main>
  </div>

  <!-- 右鍵選單 -->
  <div class="ctx-menu" id="ctxMenu" hidden></div>

  <script src="vendor/leaflet.js"></script>
  <script src="vendor/maplibre-gl.js"></script>
  <script src="vendor/leaflet-maplibre-gl.js"></script>
  <script src="vendor/proj4.js"></script>
  <script src="vendor/lucide.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/catalog.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
